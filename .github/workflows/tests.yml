name: Deterministic unittest suite

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install numpy pandas
      - name: Run selector and backtest tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = (Resolve-Path stock_selector).Path
          python -m unittest discover -s stock_selector/tests
